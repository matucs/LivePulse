# Phase 3 (MVP) compose: Postgres + Redis + backend, no Kafka yet — added in
# Phase 4 per the project's own phase gating (README.md). See
# docs/deployment.md for the full target shape once Kafka is wired in.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: livepulse
      POSTGRES_USER: livepulse
      POSTGRES_PASSWORD: livepulse_local_dev
    ports: ["5433:5432"] # 5432 already used by another local project's container
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livepulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"] # 6379 already used by another local project's container
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
